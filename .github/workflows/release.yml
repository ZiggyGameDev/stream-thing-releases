# Turns a pushed build into a release.
#
# The build server (and scripts/github-release.mjs in the app's repo) pushes a branch named
# upload/v<version> whose upload/ folder holds the built files and their latest.json. This
# checks every file against the manifest, publishes them as release v<version>, and deletes
# the branch. The release is made as a draft and published only once every file is on it,
# so "latest" never points at a release with files missing.
name: Release

on:
  push:
    branches: ['upload/v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the files against the manifest
        working-directory: upload
        run: |
          tag="${GITHUB_REF_NAME#upload/}"
          version="$(jq -er .version latest.json)"
          if [ "v$version" != "$tag" ]; then
            echo "::error::latest.json says $version but the branch is $GITHUB_REF_NAME"; exit 1
          fi
          # Every file the manifest lists must be here, be the listed size, and hash to the listed sum.
          jq -r '[.. | objects | select(has("sha256"))] | .[] | "\(.sha256)  \(.url | split("/") | last)"' latest.json > sums.txt
          test -s sums.txt
          sha256sum -c sums.txt
          # And every url must be this release's own.
          jq -er --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" \
            '[.. | objects | select(has("sha256")) | .url | startswith($base)] | all' latest.json > /dev/null \
            || { echo "::error::a url in latest.json does not point at $tag"; exit 1; }
          rm sums.txt
          jq -r '.notes // ""' latest.json > ../notes.txt
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"

      # A Samsung TV running the app through TizenBrew opens it as a page of the website
      # (samsung/, sent there by tizenbrew/index.html) and runs samsung/service/tizenbrew.js
      # beside it: both named by package.json, which is what TizenBrew reads. So the Samsung
      # build is unpacked onto main, before the release is made: TizenBrew takes
      # package.json and the service from the newest release's tag, which then has them.
      - name: Put the Samsung build on the website
        run: |
          wgt="$GITHUB_WORKSPACE/upload/stream-thing-samsung-tv.wgt"
          if [ ! -f "$wgt" ] || ! unzip -l "$wgt" | grep -q ' service/tizenbrew.js$'; then
            echo "::warning::this version has no Samsung build made for TizenBrew: the website keeps the one it has"
            exit 0
          fi
          git fetch -q --depth 1 origin main
          git worktree add -q "$RUNNER_TEMP/site" FETCH_HEAD
          cd "$RUNNER_TEMP/site"
          rm -rf samsung
          unzip -q "$wgt" -d samsung
          # What only a TV installing the package itself reads.
          rm -f samsung/config.xml samsung/*signature*.xml samsung/service/torrent-service.js
          test -f samsung/index.html
          jq --arg v "$version" '.version = $v' package.json > package.json.new
          mv package.json.new package.json
          git add -A samsung package.json
          if git diff --cached --quiet; then
            echo "the website already has this build"
            exit 0
          fi
          git -c user.name="stream-thing build" -c user.email="build@stream-thing.invalid" \
            commit -q -m "The Samsung build of stream-thing $version, for TVs running it through TizenBrew"
          git push -q origin HEAD:main

      - name: Publish the release
        working-directory: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run of the same version: put the files there again.
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber ./*
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.txt --draft=false --latest
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target main \
              --title "stream-thing $version" --notes-file ../notes.txt --latest ./*
          fi

      - name: Delete the upload branch
        run: git push origin --delete "$GITHUB_REF_NAME"
